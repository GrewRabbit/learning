# 部署流水线（cicd-workflow.md §二）
# 合并到 main 后触发：构建 → @critical E2E 测试
# E2E 依赖真实 LLM API，secrets 需在 GitHub 仓库 Settings → Secrets 中配置：
#   AI_TEXT_PROVIDER / AI_TEXT_MODEL / AI_VISION_PROVIDER / AI_VISION_MODEL
#   对应 provider 的 {PROVIDER}_API_KEY 与 {PROVIDER}_BASE_URL

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          AI_TEXT_PROVIDER: ${{ secrets.AI_TEXT_PROVIDER }}
          AI_TEXT_MODEL: ${{ secrets.AI_TEXT_MODEL }}
          AI_VISION_PROVIDER: ${{ secrets.AI_VISION_PROVIDER }}
          AI_VISION_MODEL: ${{ secrets.AI_VISION_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}

      - name: Critical E2E tests
        run: npm run test:e2e:critical
        env:
          AI_TEXT_PROVIDER: ${{ secrets.AI_TEXT_PROVIDER }}
          AI_TEXT_MODEL: ${{ secrets.AI_TEXT_MODEL }}
          AI_VISION_PROVIDER: ${{ secrets.AI_VISION_PROVIDER }}
          AI_VISION_MODEL: ${{ secrets.AI_VISION_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}

      # 部署步骤根据目标平台配置（当前预留）
      # - name: Deploy
      #   run: echo "Add deployment steps here"
